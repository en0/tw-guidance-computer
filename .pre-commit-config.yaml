repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]

  - repo: local
    hooks:
      - id: scan-secrets
        name: scan for secrets
        entry: tools/scan-secrets
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: mypy
        name: mypy
        entry: .venv/bin/mypy src/
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: arch-gates
        name: architecture gates
        entry: .venv/bin/python -m tools.arch_gates src/tw_guidance_computer
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: pytest
        name: pytest
        entry: .venv/bin/pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
